[workspace]
resolver = "2"
members = [
  "cbody-common",
  "cbody-ebpf",
  "cbody-daemon",
  "cbody-cli",
]
default-members = ["cbody-common", "cbody-cli", "cbody-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Amartya Chowdhury"]
license = "GPL3"

[workspace.dependencies]
aya-ebpf = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.3.0", default-features = false }
which = { version = "8.0.6" }
anyhow = { version = "1.0.104", default-features = false }
aya = { version = "0.16.0", default-features = false }
aya-build = { version = "0.2.1", default-features = false }
aya-log = { version = "0.4.0", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
env_logger = { version = "0.11.11", default-features = false }
libc = { version = "0.2.191", default-features = false }
log = { version = "0.4.35", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }

[profile.release.package.cbody-ebpf]
debug = 2
codegen-units = 1
strip = false
